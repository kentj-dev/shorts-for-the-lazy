<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shorts for the Lazy</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="card">
      <header class="header">
        <img class="logo" src="images/logo.png" alt="" />
        <div class="heading">
          <h1>Shorts for the Lazy</h1>
          <p>Auto Scroll</p>
        </div>
        <button
          id="shortcuts"
          class="icon-button"
          type="button"
          title="Customize keyboard shortcut"
          aria-label="Customize keyboard shortcut"
        >
          <img src="images/settings.svg" alt="" />
        </button>
      </header>

      <section class="toggle-row">
        <label for="enabled">Auto-scroll</label>
        <span class="switch"
          ><input id="enabled" type="checkbox" /><span class="slider" aria-hidden="true"></span
        ></span>
      </section>

      <section class="toggle-row badge-row">
        <label for="badge-enabled">Countdown badge</label>
        <span class="switch"
          ><input id="badge-enabled" type="checkbox" /><span class="slider" aria-hidden="true"></span
        ></span>
      </section>

      <section class="delay-section">
        <label for="delay">Delay</label>
        <div class="delay-controls">
          <div class="delay-value"><output id="delay-output">0.0</output><span>seconds</span></div>
          <div class="step-buttons">
            <button id="decrease" type="button" aria-label="Decrease delay">
              <img src="images/minus.svg" alt="" />
            </button>
            <button id="increase" type="button" aria-label="Increase delay">
              <img src="images/plus.svg" alt="" />
            </button>
          </div>
        </div>
        <input id="delay" type="range" min="0" max="5" step="0.1" value="0" />
        <div class="range-labels"><span>0</span><span>2.5</span><span>5</span></div>
      </section>

      <section class="status-row">
        <span id="status-dot"></span><span>Status:</span><strong id="status-text">Checking...</strong>
      </section>

      <section class="stats-section" aria-labelledby="stats-title">
        <h2 id="stats-title">Today</h2>
        <div class="stats-grid">
          <div><strong id="stat-shorts">0</strong><span>Shorts watched</span></div>
          <div><strong id="stat-seconds">0</strong><span>Watch seconds</span></div>
          <div><strong id="stat-scrolls">0</strong><span>Auto-scrolled</span></div>
        </div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
